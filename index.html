<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Yiddish/Hebrew Typepad">
    <title>Yiddish/Hebrew Typepad</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

    <!-- Top bar -->
    <div id="topbar">
        <h1>Yiddish/Hebrew Typepad</h1>
    </div>

    <!-- Search bar -->
    <div id="searchbar">
        <button type="button" class="btn btn-grey" id="lang-toggle" title="Toggle Yiddish/Hebrew typing (or type ~)"
                aria-pressed="true" aria-label="Toggle Yiddish/Hebrew typing">Y
        </button>
        <textarea id="search-input" type="text" rows="10" dir="auto" placeholder="Type…" autocorrect="off" autocapitalize="none"
                  spellcheck="false"></textarea>
    </div>

<script src="app.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
